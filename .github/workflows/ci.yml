name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to install (e.g. 6.8.2 or 6.12.0)'
        required: false
        default: '6.12.0'
      release_version:
        description: 'Optional release version override (e.g. 2.1.0)'
        required: false
        default: ''
      publish_release:
        description: 'Run the release manifest, minisign & publish job'
        required: false
        type: boolean
        default: false
      dry_run_release:
        description: 'Run release job in --dry-run mode (no live uploads)'
        required: false
        type: boolean
        default: true
      publish_wasm_demo:
        description: 'Sign, attach to release & sync ONLY the WebAssembly Playground (no desktop rebuild)'
        required: false
        type: boolean
        default: false
      wasm_demo_target:
        description: 'Target server environment for publish_wasm_demo (production or staging)'
        required: false
        default: 'production'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.publish_wasm_demo && 'wasm-demo' || 'default' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

env:
  QT_DEFAULT_VERSION: '6.12.0'
  CI_BUILD_VERSION: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  i18n:
    name: Translation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install minisign for release pipeline verification tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Check shell script syntax
        run: bash -n ci/*.sh

      - name: Verify release tag matches SemVer, CMakeLists.txt, and CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node ci/check-release-tag.mjs "$RELEASE_TAG"

      - name: Run check-i18n.mjs
        run: node ci/check-i18n.mjs

      - name: Run release-pulse-api self-test
        run: node services/release-pulse-api/test-server.mjs

      - name: Run release pipeline test suite
        run: node ci/test-release-pipeline.mjs

      - name: Run SBOM & license bundle test suite
        run: node ci/test-sbom-and-licenses.mjs

      - name: Run WASM demo bundle & CSP test suite
        run: node ci/test-wasm-bundle.mjs

      - name: Cache OSV-Scanner binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/ragoshell-osv-scanner
          key: osv-scanner-linux-amd64-v2.7.0

      - name: Generate SPDX 2.3 SBOM & scan dependencies (OSV-Scanner)
        run: |
          set -euo pipefail
          sbom_out="${RUNNER_TEMP:-/tmp}/ragoshell-source-sbom.spdx.json"
          node ci/generate-sbom.mjs --skip-dist --no-auto-vcpkg --output "$sbom_out"
          node ci/generate-sbom.mjs --verify-only --output "$sbom_out"

          osv_ver="v2.7.0"
          osv_sha256="160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
          osv_dir="$HOME/.cache/ragoshell-osv-scanner"
          osv_bin="$osv_dir/osv-scanner-${osv_ver}-linux-amd64"
          mkdir -p "$osv_dir"
          if [ ! -f "$osv_bin" ] || ! printf '%s  %s\n' "$osv_sha256" "$osv_bin" | sha256sum --check --status; then
            rm -f "$osv_bin"
            curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
              -o "${osv_bin}.tmp" "https://github.com/google/osv-scanner/releases/download/${osv_ver}/osv-scanner_linux_amd64"
            printf '%s  %s\n' "$osv_sha256" "${osv_bin}.tmp" | sha256sum --check
            chmod 0755 "${osv_bin}.tmp"
            mv -f "${osv_bin}.tmp" "$osv_bin"
          fi

          "$osv_bin" scan source --lockfile="$sbom_out"

  linux:
    name: Linux x64 (Build, Tests & QML)
    runs-on: ubuntu-latest
    needs: [i18n]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_wasm_demo != true || inputs.publish_release == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config autoconf automake libtool \
            curl file patchelf desktop-file-utils appstream \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libwayland-egl1 \
            libwayland-cursor0 libwayland-client0 libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1-dev libsecret-1-dev libdbus-1-3 \
            libxcb-cursor0 libxcb-keysyms1 libxcb-image0 libxcb-shm0 \
            libxcb-render-util0 libxcb-xfixes0 libxcb-shape0 libxcb-icccm4 \
            libxcb-xinerama0 libxcb-randr0 libxcb-sync1 libxcb-xkb1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          host: linux
          target: desktop
          modules: 'qt5compat qtimageformats qtwebsockets qthttpserver'
          dir: ${{ runner.temp }}/Qt
          cache: true
          cache-key-prefix: qt-linux-v3-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Cache Linux AppImage packaging tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/ragoshell-linux-tools
          key: linux-appimage-tools-v1-${{ hashFiles('ci/build-linux.sh') }}
          restore-keys: |
            linux-appimage-tools-v1-

      - name: Setup vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-linux-

      - name: Checkout & bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build, Test & Package (ci/build-linux.sh)
        env:
          Qt6_DIR: ${{ env.QT_ROOT_DIR }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          chmod +x ci/build-linux.sh
          RAGO_LINUX_TOOLS_DIR="$HOME/.cache/ragoshell-linux-tools" \
            ./ci/build-linux.sh ${CI_BUILD_VERSION:+"$CI_BUILD_VERSION"}

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ragoshell-linux-x64
          path: |
            dist/ragoshell-*-linux-x64.AppImage
            dist/ragoshell-*-linux-x64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS arm64 (Build, Tests & QML)
    runs-on: macos-latest
    needs: [i18n]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_wasm_demo != true || inputs.publish_release == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install autoconf automake libtool
          command -v ninja >/dev/null || brew install ninja
          command -v cmake >/dev/null || brew install cmake
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qt5compat qtimageformats qtwebsockets qthttpserver'
          dir: ${{ runner.temp }}/Qt
          cache: true
          cache-key-prefix: qt-macos-v2-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Setup vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-macos-

      - name: Checkout & bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build, Test & Package (ci/build-macos.sh)
        env:
          Qt6_DIR: ${{ env.QT_ROOT_DIR }}
          RAGO_MAC_SIGN_ID: ${{ github.event_name != 'pull_request' && (secrets.RAGO_MAC_SIGN_ID || secrets.APPLE_DEVELOPER_ID) || '' }}
          RAGO_MAC_CERT_P12_BASE64: ${{ github.event_name != 'pull_request' && (secrets.RAGO_MAC_CERT_P12_BASE64 || secrets.APPLE_CERT_P12_BASE64) || '' }}
          RAGO_MAC_CERT_PASSWORD: ${{ github.event_name != 'pull_request' && (secrets.RAGO_MAC_CERT_PASSWORD || secrets.APPLE_CERT_PASSWORD) || '' }}
          RAGO_MAC_NOTARY_KEY_ID: ${{ github.event_name != 'pull_request' && (secrets.RAGO_MAC_NOTARY_KEY_ID || secrets.APPLE_API_KEY_ID) || '' }}
          RAGO_MAC_NOTARY_ISSUER: ${{ github.event_name != 'pull_request' && (secrets.RAGO_MAC_NOTARY_ISSUER || secrets.APPLE_API_ISSUER) || '' }}
          RAGO_MAC_NOTARY_KEY_BASE64: ${{ github.event_name != 'pull_request' && (secrets.RAGO_MAC_NOTARY_KEY_BASE64 || secrets.APPLE_API_KEY) || '' }}
        run: |
          chmod +x ci/build-macos.sh
          ./ci/build-macos.sh ${CI_BUILD_VERSION:+"$CI_BUILD_VERSION"}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ragoshell-macos-arm64
          path: |
            dist/ragoshell-*-macos-arm64.dmg
            dist/ragoshell-*-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64 (Build, Tests & QML)
    runs-on: windows-latest
    needs: [i18n]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_wasm_demo != true || inputs.publish_release == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install NSIS and WiX v5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Failed to install NSIS ($LASTEXITCODE)" }
          }
          if (Test-Path "${env:ProgramFiles(x86)}\NSIS") {
            "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          dotnet tool update --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to install WiX v5 CLI ($LASTEXITCODE)" }
          $wixDir = Join-Path $env:USERPROFILE '.dotnet\tools'
          $wixExe = Join-Path $wixDir 'wix.exe'
          & $wixExe extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to install WixToolset.UI.wixext ($LASTEXITCODE)" }
          $wixDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qt5compat qtimageformats qtwebsockets qthttpserver'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          dir: ${{ runner.temp }}/Qt
          cache: true
          cache-key-prefix: qt-windows-v3-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Setup vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-windows-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'vcpkg-cache') | Out-Null
          $vcpkgJson = Get-Content -Raw vcpkg.json | ConvertFrom-Json
          $baseline = $vcpkgJson.'builtin-baseline'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if ($vcpkgRoot -and (Test-Path $vcpkgRoot)) {
            git -C $vcpkgRoot cat-file -e "$baseline^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C $vcpkgRoot fetch --depth=1 origin $baseline
              if ($LASTEXITCODE -ne 0) {
                git -C $vcpkgRoot fetch origin
                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to fetch vcpkg baseline $baseline into $vcpkgRoot"
                }
              }
            }
          } else {
            $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { throw 'Failed to clone microsoft/vcpkg' }
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw 'Failed to bootstrap vcpkg' }
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Azure Trusted Signing client (optional)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          RAGO_WIN_SIGN_METADATA_JSON: ${{ secrets.RAGO_WIN_SIGN_METADATA_JSON }}
          RAGO_WIN_SIGN_DLIB: ${{ secrets.RAGO_WIN_SIGN_DLIB }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAGO_WIN_SIGN_METADATA_JSON) -or -not [string]::IsNullOrWhiteSpace($env:RAGO_WIN_SIGN_DLIB)) {
              Write-Host 'Azure Trusted Signing metadata not configured (or RAGO_WIN_SIGN_DLIB already provided); skipping Dlib client download.'
              exit 0
          }
          $ErrorActionPreference = 'Stop'
          $tsDir = Join-Path $env:RUNNER_TEMP 'trusted-signing'
          New-Item -ItemType Directory -Force $tsDir | Out-Null
          $nupkgZip = Join-Path $tsDir 'Microsoft.Trusted.Signing.Client.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client' -OutFile $nupkgZip
          Expand-Archive -Path $nupkgZip -DestinationPath (Join-Path $tsDir 'pkg') -Force
          $dlibFile = Get-ChildItem -Path (Join-Path $tsDir 'pkg') -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
              Select-Object -First 1
          if (-not $dlibFile) {
              throw 'Azure.CodeSigning.Dlib.dll (x64) not found in Microsoft.Trusted.Signing.Client NuGet package.'
          }
          "RAGO_WIN_SIGN_DLIB=$($dlibFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build, Test & Package (ci/build-windows.ps1)
        shell: pwsh
        env:
          Qt6_DIR: ${{ env.QT_ROOT_DIR }}
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
          RAGO_WIN_SIGN_PFX_BASE64: ${{ github.event_name != 'pull_request' && (secrets.RAGO_WIN_SIGN_PFX_BASE64 || secrets.WINDOWS_CERT_BASE64) || '' }}
          RAGO_WIN_SIGN_PASSWORD: ${{ github.event_name != 'pull_request' && (secrets.RAGO_WIN_SIGN_PASSWORD || secrets.WINDOWS_CERT_PASSWORD) || '' }}
          RAGO_WIN_SIGN_SHA1: ${{ github.event_name != 'pull_request' && secrets.RAGO_WIN_SIGN_SHA1 || '' }}
          RAGO_WIN_SIGN_SUBJECT: ${{ github.event_name != 'pull_request' && secrets.RAGO_WIN_SIGN_SUBJECT || '' }}
          RAGO_WIN_SIGN_DLIB: ${{ github.event_name != 'pull_request' && (env.RAGO_WIN_SIGN_DLIB || secrets.RAGO_WIN_SIGN_DLIB) || '' }}
          RAGO_WIN_SIGN_METADATA_JSON: ${{ github.event_name != 'pull_request' && secrets.RAGO_WIN_SIGN_METADATA_JSON || '' }}
          RAGO_WIN_SIGN_TIMESTAMP_URL: ${{ github.event_name != 'pull_request' && secrets.RAGO_WIN_SIGN_TIMESTAMP_URL || '' }}
          AZURE_TENANT_ID: ${{ github.event_name != 'pull_request' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          .\ci\build-windows.ps1 -Config Release -Version "$env:CI_BUILD_VERSION"
          foreach ($pattern in @('dist/ragoshell-*-windows-x64.zip', 'dist/ragoshell-*-windows-x64-setup.exe', 'dist/ragoshell-*-windows-x64.msi')) {
            if (-not (Get-Item $pattern -ErrorAction SilentlyContinue)) {
              throw "Expected Windows release artifact missing: $pattern"
            }
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ragoshell-windows-x64
          path: |
            dist/ragoshell-*-windows-x64.zip
            dist/ragoshell-*-windows-x64-setup.exe
            dist/ragoshell-*-windows-x64.msi
          if-no-files-found: error

  android:
    name: Android arm64 APK & AAB
    runs-on: ubuntu-latest
    needs: [i18n]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_wasm_demo != true || inputs.publish_release == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install Android SDK Platform 37 & Build-Tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmgr=""
          if [ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdkmgr="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$sdk_root/cmdline-tools" ]; then
            sdkmgr="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          [ -x "$sdkmgr" ] || { echo "error: sdkmanager not found under $sdk_root" >&2; exit 1; }
          yes | "$sdkmgr" --licenses >/dev/null || true
          "$sdkmgr" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config autoconf automake libtool llvm unzip zip

      - name: Install Qt 6 Host
        id: qt-host
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          host: linux
          target: desktop
          dir: ${{ runner.temp }}/QtHost
          set-env: false
          cache: true
          cache-key-prefix: qt-host-v2-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Install Qt 6 Android
        id: qt-android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: 'qt5compat qtimageformats qtwebsockets'
          dir: ${{ runner.temp }}/QtAndroid
          set-env: false
          cache: true
          cache-key-prefix: qt-android-v2-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Setup vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-android-

      - name: Checkout & bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build, Sign & Verify Android APK + AAB (ci/build-android.sh)
        env:
          Qt6_DIR: ${{ steps.qt-host.outputs.qt-root-dir }}
          Qt6_DIR_ANDROID: ${{ steps.qt-android.outputs.qt-root-dir }}
          RAGO_ANDROID_REQUIRE_SIGNING: ${{ ((startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_DRY_RUN != '1') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.dry_run_release != true)) && '1' || '0' }}
          RAGO_ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && (secrets.RAGO_ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64) || '' }}
          RAGO_ANDROID_KEYSTORE_PASS: ${{ github.event_name != 'pull_request' && (secrets.RAGO_ANDROID_KEYSTORE_PASS || secrets.ANDROID_KEYSTORE_PASSWORD) || '' }}
          RAGO_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && (secrets.RAGO_ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS) || '' }}
          RAGO_ANDROID_KEY_PASS: ${{ github.event_name != 'pull_request' && (secrets.RAGO_ANDROID_KEY_PASS || secrets.ANDROID_KEY_PASSWORD) || '' }}
        run: |
          chmod +x ci/build-android.sh
          ./ci/build-android.sh ${CI_BUILD_VERSION:+"$CI_BUILD_VERSION"}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ragoshell-android-arm64
          path: |
            dist/ragoshell-*-android-arm64.apk
            dist/ragoshell-*-android-arm64.aab
          if-no-files-found: error

  wasm:
    name: WebAssembly Playground (wasm-multi)
    runs-on: ubuntu-latest
    needs: [i18n]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config autoconf automake libtool \
            brotli perl python3 curl ca-certificates unzip zip

      - name: Install Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '5.0.5'
          actions-cache-folder: emsdk-cache

      - name: Install Qt 6 Host
        id: qt-host
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          host: linux
          target: desktop
          dir: ${{ runner.temp }}/QtHost
          set-env: false
          cache: true
          cache-key-prefix: qt-host-v2-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Install Qt 6 WebAssembly (wasm_multithread)
        id: qt-wasm
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_multithread
          modules: 'qt5compat qtimageformats qtwebsockets'
          dir: ${{ runner.temp }}/QtWasm
          set-env: false
          cache: true
          cache-key-prefix: qt-wasm-v1-${{ inputs.qt_version || vars.QT_VERSION || env.QT_DEFAULT_VERSION }}

      - name: Setup vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-wasm-multi-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-wasm-multi-

      - name: Checkout & bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Build & Package WebAssembly Playground (ci/build-wasm.sh)
        env:
          Qt6_DIR: ${{ steps.qt-host.outputs.qt-root-dir }}
          QT_WASM_PATH: ${{ steps.qt-wasm.outputs.qt-root-dir }}
        run: |
          chmod +x ci/build-wasm.sh
          wasm_args=()
          if [ -n "${CI_BUILD_VERSION:-}" ]; then
            wasm_args+=(-- "$CI_BUILD_VERSION")
          fi
          ./ci/build-wasm.sh "${wasm_args[@]}"

      - name: Upload WebAssembly Playground Bundle
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: wasm-demo-bundle
          path: |
            dist/wasm/*-wasm-demo.tar.gz
            dist/wasm/*-wasm-demo.tar.gz.sha256
          if-no-files-found: error

  release-dry-run:
    name: Release Manifest & Minisign (Dry Run)
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, android, wasm]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.dry_run_release == true) || (startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_DRY_RUN == '1')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install minisign and Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign jq curl ca-certificates python3

      - name: Download all platform release artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          pattern: ragoshell-*
          path: dist
          merge-multiple: true

      - name: Download WebAssembly Playground bundle into dist/wasm/
        uses: actions/download-artifact@v8
        with:
          name: wasm-demo-bundle
          path: dist/wasm

      - name: Generate releases.json & SHA256SUMS.txt, sign with ephemeral key & verify dry-run plan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x ci/sign-release.sh ci/sign-wasm-demo.sh ci/publish-release.sh ci/gitea-release.sh

          ephem_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rago-dryrun-key.XXXXXX")"
          chmod 700 "$ephem_dir"
          trap 'rm -rf "$ephem_dir"' EXIT

          minisign -G -W -p "$ephem_dir/dryrun.pub" -s "$ephem_dir/dryrun.key" >/dev/null
          export RAGO_MINISIGN_SECRET_KEY_FILE="$ephem_dir/dryrun.key"
          export RAGO_MINISIGN_PUBKEY="$(tail -n 1 "$ephem_dir/dryrun.pub" | tr -d '[:space:]')"
          export R2_ACCOUNT_ID="00000000000000000000000000000000"

          pub_args=(--dry-run --allow-test-pubkey --dist dist --targets "r2,github,gitea")
          if [ -n "${CI_BUILD_VERSION:-}" ]; then
            pub_args+=(--version "$CI_BUILD_VERSION")
          fi
          ./ci/publish-release.sh "${pub_args[@]}"

      - name: Upload dry-run release manifest & checksums artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ragoshell-release-metadata-dryrun
          path: |
            dist/releases.json
            dist/releases.json.minisig
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig
            dist/*-sbom.spdx.json
            dist/wasm/*-wasm-demo.tar.gz.minisig
          if-no-files-found: error

  release:
    name: Release Manifest, Minisign & Publish
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, android, wasm]
    if: (startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_DRY_RUN != '1') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.publish_release == true && inputs.dry_run_release == false)
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install minisign and AWS CLI (for R2 S3-compatible uploads)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign awscli jq curl ca-certificates python3 openssh-client

      - name: Download all platform release artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          pattern: ragoshell-*
          path: dist
          merge-multiple: true

      - name: Download WebAssembly Playground bundle into dist/wasm/
        uses: actions/download-artifact@v8
        with:
          name: wasm-demo-bundle
          path: dist/wasm

      - name: Generate releases.json & SHA256SUMS.txt, sign with minisign, verify & publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RAGO_MINISIGN_SECRET_KEY: ${{ secrets.RAGO_MINISIGN_SECRET_KEY || secrets.MINISIGN_SECRET_KEY }}
          RAGO_MINISIGN_PASSWORD: ${{ secrets.RAGO_MINISIGN_PASSWORD || secrets.MINISIGN_PASSWORD }}
          RAGO_MINISIGN_PUBKEY: ${{ secrets.RAGO_MINISIGN_PUBKEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_HOST: ${{ secrets.GITEA_HOST }}
          GITEA_REPO: ${{ secrets.GITEA_REPO }}
          PULSE_API_ADMIN_URL: ${{ secrets.PULSE_API_ADMIN_URL }}
          PULSE_ADMIN_TOKEN: ${{ secrets.PULSE_ADMIN_TOKEN }}
          RAGO_SITE_RELEASES_SSH: ${{ secrets.RAGO_SITE_RELEASES_SSH }}
          RAGO_SITE_SSH_KEY: ${{ secrets.RAGO_SITE_SSH_KEY }}
          RAGO_SITE_KNOWN_HOSTS: ${{ secrets.RAGO_SITE_KNOWN_HOSTS }}
          RAGO_ANDROID_STORE_URL: ${{ secrets.RAGO_ANDROID_STORE_URL }}
          RAGO_IOS_STORE_URL: ${{ secrets.RAGO_IOS_STORE_URL }}
          RAGO_MIN_SUPPORTED_VERSION: ${{ secrets.RAGO_MIN_SUPPORTED_VERSION }}
        run: |
          set -euo pipefail
          chmod +x ci/sign-release.sh ci/sign-wasm-demo.sh ci/publish-release.sh ci/gitea-release.sh

          ssh_cleanup=""
          trap '[ -z "$ssh_cleanup" ] || rm -rf "$ssh_cleanup"' EXIT

          targets=("github")
          if [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ]; then
            targets+=("r2")
          fi
          if [ -n "${GITEA_TOKEN:-}" ]; then
            targets+=("gitea")
          fi
          if [ -n "${PULSE_ADMIN_TOKEN:-}" ]; then
            targets+=("pulse")
          fi
          if [ -n "${RAGO_SITE_RELEASES_SSH:-}" ] && [ -n "${RAGO_SITE_SSH_KEY:-}" ] && [ -n "${RAGO_SITE_KNOWN_HOSTS:-}" ]; then
            ssh_cleanup="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rago-site-ssh.XXXXXX")"
            chmod 700 "$ssh_cleanup"
            install -d -m 700 "$HOME/.ssh"
            (umask 077 && printf '%s\n' "$RAGO_SITE_SSH_KEY" > "$ssh_cleanup/id_ed25519")
            printf '%s\n' "$RAGO_SITE_KNOWN_HOSTS" >> "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            printf 'Host *\n  IdentityFile %s/id_ed25519\n  IdentitiesOnly yes\n' "$ssh_cleanup" >> "$HOME/.ssh/config"
            chmod 600 "$HOME/.ssh/config"
            targets+=("site")
          fi

          IFS=',' eval 'targets_csv="${targets[*]}"'
          pub_args=(--dist dist --targets "$targets_csv")
          if [ -n "${CI_BUILD_VERSION:-}" ]; then
            pub_args+=(--version "$CI_BUILD_VERSION")
          fi
          if [ -n "${RAGO_MIN_SUPPORTED_VERSION:-}" ]; then
            pub_args+=(--min-supported-version "$RAGO_MIN_SUPPORTED_VERSION")
          fi

          ./ci/publish-release.sh "${pub_args[@]}"

      - name: Trigger Gitea HTTPS release-manifest sync hook (when direct SSH is not used)
        if: success()
        env:
          SYNC_TOKEN: ${{ secrets.GITEA_RELEASE_SYNC_TOKEN || secrets.GITEA_TOKEN }}
          GITEA_HOST: ${{ secrets.GITEA_HOST || vars.GITEA_HOST }}
          GITEA_SYNC_REPO: ${{ secrets.GITEA_SYNC_REPO || vars.GITEA_SYNC_REPO }}
          DIRECT_SSH_TARGET: ${{ secrets.RAGO_SITE_RELEASES_SSH }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_VER: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          set +x

          if [ -n "${DIRECT_SSH_TARGET:-}" ]; then
            echo "Direct RAGO_SITE_RELEASES_SSH already handled site manifest update; skipping Gitea sync hook."
            exit 0
          fi
          if [ -z "${SYNC_TOKEN:-}" ] || [ -z "${GITEA_HOST:-}" ] || [ -z "${GITEA_SYNC_REPO:-}" ]; then
            echo "::notice::GITEA_RELEASE_SYNC_TOKEN, GITEA_HOST, or GITEA_SYNC_REPO is not set; skipping Gitea release-manifest sync dispatch."
            exit 0
          fi
          if [[ "$SYNC_TOKEN" =~ [[:cntrl:][:space:]\"\\] ]]; then
            echo "::error::Gitea sync token contains invalid whitespace, control, quote, or backslash characters."
            exit 1
          fi

          raw_ver="${INPUT_RELEASE_VER:-$RELEASE_REF_NAME}"
          tag="v${raw_ver#v}"
          if [[ "$tag" == *-* ]]; then
            echo "Skipping Gitea root manifest sync for pre-release tag $tag."
            exit 0
          fi
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]; then
            echo "::error::Refusing Gitea sync dispatch for unexpected tag '$tag'."
            exit 1
          fi

          host="${GITEA_HOST%/}"
          if ! [[ "$host" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || ! [[ "$GITEA_SYNC_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || [[ "$GITEA_SYNC_REPO" == *".."* ]]; then
            echo "::error::Invalid GITEA_HOST or GITEA_SYNC_REPO format."
            exit 1
          fi

          umask 077
          dispatch_tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gitea-sync-dispatch.XXXXXX")"
          chmod 700 "$dispatch_tmp"
          trap 'rm -rf "$dispatch_tmp"' EXIT

          echo "Triggering Gitea sync-releases-manifest.yml on $host for $GITEA_SYNC_REPO ($tag)..."
          wf_payload="$(TAG="$tag" node -e 'process.stdout.write(JSON.stringify({ ref: "main", inputs: { tag: process.env.TAG } }))')"
          wf_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --config - \
            -o "$dispatch_tmp/wf.out" -w '%{http_code}' \
            -X POST "$host/api/v1/repos/$GITEA_SYNC_REPO/actions/workflows/sync-releases-manifest.yml/dispatches" \
            -H 'Content-Type: application/json' \
            -d "$wf_payload" <<EOF
          header = "Authorization: token ${SYNC_TOKEN}"
          EOF
          )"

          if [ "$wf_status" = "204" ] || [ "$wf_status" = "200" ]; then
            echo "Triggered Gitea sync-releases-manifest.yml workflow_dispatch successfully (HTTP $wf_status)."
            demo_payload="$(TAG="$tag" node -e 'process.stdout.write(JSON.stringify({ ref: "main", inputs: { tag: process.env.TAG, target_env: "production" } }))')"
            demo_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --config - \
              -o "$dispatch_tmp/demo-wf.out" -w '%{http_code}' \
              -X POST "$host/api/v1/repos/$GITEA_SYNC_REPO/actions/workflows/sync-wasm-demo.yml/dispatches" \
              -H 'Content-Type: application/json' \
              -d "$demo_payload" <<EOF
          header = "Authorization: token ${SYNC_TOKEN}"
          EOF
            )"
            if [ "$demo_status" = "204" ] || [ "$demo_status" = "200" ]; then
              echo "Triggered Gitea sync-wasm-demo.yml workflow_dispatch successfully (HTTP $demo_status)."
            else
              demo_repo_payload="$(TAG="$tag" node -e 'process.stdout.write(JSON.stringify({ event_type: "wasm-demo-published", client_payload: { tag: process.env.TAG, target_env: "production" } }))')"
              demo_repo_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --config - \
                -o "$dispatch_tmp/demo-repo.out" -w '%{http_code}' \
                -X POST "$host/api/v1/repos/$GITEA_SYNC_REPO/dispatches" \
                -H 'Content-Type: application/json' \
                -d "$demo_repo_payload" <<EOF
          header = "Authorization: token ${SYNC_TOKEN}"
          EOF
              )"
              if [ "$demo_repo_status" = "204" ] || [ "$demo_repo_status" = "200" ]; then
                echo "Triggered Gitea wasm-demo-published repository_dispatch successfully (HTTP $demo_repo_status)."
              else
                echo "::warning::sync-wasm-demo dispatch returned HTTP $demo_status / $demo_repo_status (ensure sync-wasm-demo.yml is on $GITEA_SYNC_REPO main)."
              fi
            fi
            exit 0
          fi

          echo "workflow_dispatch returned HTTP $wf_status; trying repository_dispatch fallback..."
          repo_payload="$(TAG="$tag" node -e 'process.stdout.write(JSON.stringify({ event_type: "release-published", client_payload: { tag: process.env.TAG } }))')"
          repo_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --config - \
            -o "$dispatch_tmp/repo.out" -w '%{http_code}' \
            -X POST "$host/api/v1/repos/$GITEA_SYNC_REPO/dispatches" \
            -H 'Content-Type: application/json' \
            -d "$repo_payload" <<EOF
          header = "Authorization: token ${SYNC_TOKEN}"
          EOF
          )"

          if [ "$repo_status" = "204" ] || [ "$repo_status" = "200" ]; then
            echo "Triggered Gitea repository_dispatch successfully (HTTP $repo_status)."
            exit 0
          fi

          echo "::error::Failed to trigger Gitea release-manifest sync (workflow_dispatch HTTP $wf_status, repository_dispatch HTTP $repo_status)."
          exit 1

      - name: Upload signed release manifest & checksums artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ragoshell-release-metadata
          path: |
            dist/releases.json
            dist/releases.json.minisig
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.minisig
            dist/*-sbom.spdx.json
            dist/wasm/*-wasm-demo.tar.gz.minisig
          if-no-files-found: error

  publish-wasm-demo-dry-run:
    name: Sign & Sync WebAssembly Playground (Dry Run)
    runs-on: ubuntu-latest
    needs: [wasm]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_wasm_demo == true && inputs.publish_release != true && inputs.dry_run_release == true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install minisign & Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign jq curl ca-certificates python3

      - name: Download WebAssembly Playground bundle into dist/wasm/
        uses: actions/download-artifact@v8
        with:
          name: wasm-demo-bundle
          path: dist/wasm

      - name: Dry-run sign & verify WASM Playground bundle with ephemeral Minisign key
        env:
          INPUT_RELEASE_VER: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          chmod +x ci/sign-wasm-demo.sh

          ephem_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/rago-wasm-dryrun.XXXXXX")"
          chmod 700 "$ephem_dir"
          trap 'rm -rf "$ephem_dir"' EXIT

          minisign -G -W -p "$ephem_dir/dryrun.pub" -s "$ephem_dir/dryrun.key" >/dev/null
          export RAGO_MINISIGN_SECRET_KEY_FILE="$ephem_dir/dryrun.key"
          export RAGO_MINISIGN_PUBKEY="$(tail -n 1 "$ephem_dir/dryrun.pub" | tr -d '[:space:]')"

          ver_args=(--allow-test-pubkey)
          if [ -n "${INPUT_RELEASE_VER:-}" ]; then
            ver_args+=(--version "$INPUT_RELEASE_VER")
          fi
          ./ci/sign-wasm-demo.sh "${ver_args[@]}"
          echo "[dry-run] WASM Playground signature & USTAR archive verified cleanly."

  publish-wasm-demo:
    name: Sign & Sync WebAssembly Playground
    runs-on: ubuntu-latest
    needs: [wasm]
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && inputs.publish_wasm_demo == true && inputs.publish_release != true && inputs.dry_run_release == false
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install minisign, curl & Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign jq curl ca-certificates python3

      - name: Download WebAssembly Playground bundle into dist/wasm/
        uses: actions/download-artifact@v8
        with:
          name: wasm-demo-bundle
          path: dist/wasm

      - name: Sign WASM Playground bundle, attach to GitHub Release & trigger Gitea sync-wasm-demo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_RELEASE_VER: ${{ inputs.release_version }}
          TARGET_ENV: ${{ inputs.wasm_demo_target || 'production' }}
          RAGO_MINISIGN_SECRET_KEY: ${{ secrets.RAGO_MINISIGN_SECRET_KEY || secrets.MINISIGN_SECRET_KEY }}
          RAGO_MINISIGN_PASSWORD: ${{ secrets.RAGO_MINISIGN_PASSWORD || secrets.MINISIGN_PASSWORD }}
          RAGO_MINISIGN_PUBKEY: ${{ secrets.RAGO_MINISIGN_PUBKEY }}
          SYNC_TOKEN: ${{ secrets.GITEA_RELEASE_SYNC_TOKEN || secrets.GITEA_TOKEN }}
          GITEA_HOST: ${{ secrets.GITEA_HOST || vars.GITEA_HOST }}
          GITEA_SYNC_REPO: ${{ secrets.GITEA_SYNC_REPO || vars.GITEA_SYNC_REPO }}
        run: |
          set -euo pipefail
          set +x
          chmod +x ci/sign-wasm-demo.sh

          target_env="$(printf '%s' "$TARGET_ENV" | tr -d '[:space:]')"
          if [ "$target_env" != "production" ] && [ "$target_env" != "staging" ]; then
            echo "::error::wasm_demo_target must be 'production' or 'staging' (got '$target_env')."
            exit 1
          fi

          if [ -n "${INPUT_RELEASE_VER:-}" ]; then
            tag="v${INPUT_RELEASE_VER#v}"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease -q 'select(.isDraft == false and .isPrerelease == false) | .tagName' || true)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not resolve an existing published stable GitHub Release tag (pass release_version explicitly or create a release first)."
            exit 1
          fi

          allow_pre="false"
          if [[ "$tag" == *-* ]]; then
            if [ "$target_env" = "production" ]; then
              echo "::error::Pre-release tag '$tag' cannot target production demo; set wasm_demo_target=staging."
              exit 1
            fi
            allow_pre="true"
          fi
          if [ "$allow_pre" = "true" ]; then
            if ! [[ "$tag" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})-[0-9A-Za-z.-]+$ ]]; then
              echo "::error::Invalid SemVer pre-release tag '$tag'."
              exit 1
            fi
          else
            if ! [[ "$tag" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$ ]]; then
              echo "::error::Invalid stable SemVer tag '$tag'."
              exit 1
            fi
          fi

          # Verify target GitHub Release exists and is published (not draft) before decrypting Minisign key.
          rel_meta="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease || true)"
          if [ -z "$rel_meta" ]; then
            echo "::error::GitHub Release '$tag' does not exist on $GITHUB_REPOSITORY."
            exit 1
          fi
          REL_META="$rel_meta" TENV="$target_env" node -e '
            const m = JSON.parse(process.env.REL_META);
            if (m.isDraft) {
              console.error("::error::Refusing to attach WASM Playground bundle to a draft GitHub Release (assets would 404 on public sync).");
              process.exit(1);
            }
            if (process.env.TENV === "production" && m.isPrerelease) {
              console.error("::error::Refusing to sync a pre-release GitHub Release to production demo.");
              process.exit(1);
            }
          '

          archive_name="$(node ci/verify-remote-manifest.mjs print-demo-urls | node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(0, "utf8")).archiveName)')"
          archive_path="dist/wasm/$archive_name"
          sig_path="${archive_path}.minisig"

          ./ci/sign-wasm-demo.sh --archive "$archive_path" --version "${tag#v}"

          verify_args=(verify-demo --archive "$archive_path" --sig "$sig_path" --tag "$tag")
          [ "$allow_pre" = "true" ] && verify_args+=(--allow-prerelease)
          node ci/verify-remote-manifest.mjs "${verify_args[@]}"

          echo "Uploading signed $archive_name + .minisig to GitHub Release $tag ..."
          gh release upload "$tag" "$archive_path" "$sig_path" --repo "$GITHUB_REPOSITORY" --clobber

          if [ -z "${SYNC_TOKEN:-}" ] || [ -z "${GITEA_HOST:-}" ] || [ -z "${GITEA_SYNC_REPO:-}" ]; then
            echo "::notice::GITEA_RELEASE_SYNC_TOKEN, GITEA_HOST, or GITEA_SYNC_REPO is not set; trigger sync-wasm-demo manually in Gitea."
            exit 0
          fi
          if [[ "$SYNC_TOKEN" =~ [[:cntrl:][:space:]\"\\] ]]; then
            echo "::error::Gitea sync token contains invalid whitespace, control, quote, or backslash characters."
            exit 1
          fi

          host="${GITEA_HOST%/}"
          if ! [[ "$host" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || ! [[ "$GITEA_SYNC_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || [[ "$GITEA_SYNC_REPO" == *".."* ]]; then
            echo "::error::Invalid GITEA_HOST or GITEA_SYNC_REPO format."
            exit 1
          fi

          umask 077
          dispatch_tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/gitea-wasm-dispatch.XXXXXX")"
          chmod 700 "$dispatch_tmp"
          trap 'rm -rf "$dispatch_tmp"' EXIT

          wf_payload="$(TAG="$tag" TENV="$target_env" node -e '
            process.stdout.write(JSON.stringify({
              ref: "main",
              inputs: {
                tag: process.env.TAG,
                target_env: process.env.TENV
              }
            }));
          ')"
          wf_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --config - \
            -o "$dispatch_tmp/wf.out" -w '%{http_code}' \
            -X POST "$host/api/v1/repos/$GITEA_SYNC_REPO/actions/workflows/sync-wasm-demo.yml/dispatches" \
            -H 'Content-Type: application/json' \
            -d "$wf_payload" <<EOF
          header = "Authorization: token ${SYNC_TOKEN}"
          EOF
          )"
          if [ "$wf_status" = "204" ] || [ "$wf_status" = "200" ]; then
            echo "Triggered Gitea sync-wasm-demo.yml workflow_dispatch successfully (HTTP $wf_status)."
            exit 0
          fi

          repo_payload="$(TAG="$tag" TENV="$target_env" node -e '
            process.stdout.write(JSON.stringify({
              event_type: "wasm-demo-published",
              client_payload: {
                tag: process.env.TAG,
                target_env: process.env.TENV
              }
            }));
          ')"
          repo_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --config - \
            -o "$dispatch_tmp/repo.out" -w '%{http_code}' \
            -X POST "$host/api/v1/repos/$GITEA_SYNC_REPO/dispatches" \
            -H 'Content-Type: application/json' \
            -d "$repo_payload" <<EOF
          header = "Authorization: token ${SYNC_TOKEN}"
          EOF
          )"
          if [ "$repo_status" = "204" ] || [ "$repo_status" = "200" ]; then
            echo "Triggered Gitea wasm-demo-published repository_dispatch successfully (HTTP $repo_status)."
            exit 0
          fi

          echo "::error::Failed to trigger Gitea sync-wasm-demo (workflow_dispatch HTTP $wf_status, repository_dispatch HTTP $repo_status)."
          exit 1
