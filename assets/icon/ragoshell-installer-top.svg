<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <!-- The header of the NSIS installer pages (install/windows/nsis-topbar.bmp), 150x57: the icon, the wordmark
       and the tagline of ragoshell-wordmark.svg in a small lockup. dev/icons/make-icons.sh renders it. -->
  <defs>
    <linearGradient id="topBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2319" />
      <stop offset="100%" stop-color="#05140e" />
    </linearGradient>
    <linearGradient id="topPetal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#028639" />
      <stop offset="45%" stop-color="#00be54" />
      <stop offset="100%" stop-color="#34f28b" />
    </linearGradient>
  </defs>
  <rect width="150" height="57" fill="#ffffff" />

  <!-- The app icon at 41 px (the squircle of ragoshell-icon.svg, the emblem of ragoshell-wordmark.svg scaled by 41/200) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="41" height="41" rx="9.4" fill="url(#topBg)" />
    <g transform="translate(20.5, 21.3) scale(0.08)">
      <g transform="rotate(0)"><path d="M 0,-160 C 30,-120 46,-58 0,0 C -46,-58 -30,-120 0,-160 Z" fill="url(#topPetal)" /></g>
      <g transform="rotate(72)"><path d="M 0,-160 C 30,-120 46,-58 0,0 C -46,-58 -30,-120 0,-160 Z" fill="url(#topPetal)" /></g>
      <g transform="rotate(144)"><path d="M 0,-160 C 30,-120 46,-58 0,0 C -46,-58 -30,-120 0,-160 Z" fill="url(#topPetal)" /></g>
      <g transform="rotate(216)"><path d="M 0,-160 C 30,-120 46,-58 0,0 C -46,-58 -30,-120 0,-160 Z" fill="url(#topPetal)" /></g>
      <g transform="rotate(288)"><path d="M 0,-160 C 30,-120 46,-58 0,0 C -46,-58 -30,-120 0,-160 Z" fill="url(#topPetal)" /></g>
      <circle cx="0" cy="0" r="46" fill="#04180f" opacity="0.58" />
      <circle cx="0" cy="0" r="15" fill="#022a18" />
      <circle cx="0" cy="0" r="6.5" fill="#3bf592" opacity="0.95" />
    </g>
  </g>

  <text x="57" y="31"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif"
        font-size="20" font-weight="800" letter-spacing="-0.3"><tspan fill="#0c2319">Rago</tspan><tspan fill="#00be54">Shell</tspan></text>
  <text x="58" y="43"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'JetBrains Mono', 'Segoe UI', monospace, sans-serif"
        font-size="5.4" font-weight="600" letter-spacing="2.1" fill="#527967">MONGODB IDE</text>
</svg>
